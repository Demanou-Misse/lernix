spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lernix
    username: lernix_user
    password: lernix_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Schema must match Flyway migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE # Log SQL parameters (Hibernate 6+)
