spring:
  datasource:
    url: jdbc:h2:mem:lernixdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true # To check data at http://localhost:8080/h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Automatically create tables for this test
    show-sql: true

  # Flyway migration
  flyway:
    enabled: true
    baseline-on-migrate: true
