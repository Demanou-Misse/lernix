spring:
  datasource:
    # Connects to the PostgreSQL container started via compose.yaml
    url: jdbc:postgresql://localhost:5432/lernix_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'validate' ensures DB schema matches Java entities
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Performance optimization for modern Postgres
        jdbc.batch_size: 25
        order_inserts: true

  # Flyway: The source of truth for your database schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Ensures Flyway can start even if the DB already has some data
    baseline-on-migrate: true
    # Prevents accidental execution in the wrong environment
    clean-disabled: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

