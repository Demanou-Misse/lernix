spring:
  application:
    name: lernix-backend

  profiles:
    active: dev # Default profile for local development

  # Global JSON configuration (API consistency & 2026 standards)
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      default-property-inclusion: non_null # Avoid sending null fields
    time-zone: UTC

  # JPA framework-level behavior (independent of the database)
  jpa:
    open-in-view: false # Prevent lazy loading outside transactions
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        jdbc.batch_size: 25 # Optimized for batch inserts (e.g. ReviewHistory)
        order_inserts: true
        order_updates: true

server:
  port: 8080
  shutdown: graceful # Allow active requests to finish on shutdown

# Observability & monitoring (enterprise baseline)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

