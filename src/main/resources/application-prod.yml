spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      pool-name: LernixHikariPool

  jpa:
    hibernate:
      ddl-auto: none # Never let the app modify schema in production
    show-sql: false

  flyway:
    enabled: true
    ignore-missing-migrations: false # Fail fast if migrations are inconsistent

logging:
  level:
    root: INFO
    com.lernix: INFO

